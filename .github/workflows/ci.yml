name: Kinetik Core CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Pull down the fresh code from your repository
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      # 2. Set up Docker Buildx (Modern caching mechanism for faster builds)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Test building your custom Dockerfile to ensure no syntax or configuration breakages
      - name: Test Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false # We only want to test-build it for now, not push it to a registry
          tags: kinetik:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 4. Verify that Docker Compose can read your layout smoothly
      - name: Verify Docker Compose Layout
        run: |
          docker compose config
          echo "Success! The Docker Compose architecture and configuration are structurally valid."

  deploy:
    needs: build-and-test
    # Only run the deployment block if the push event happened directly on the main branch
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Sync Files to InfinityFree via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # InfinityFree serves web files strictly from the htdocs directory
          server-dir: htdocs/
          # Exclude git, docker, and local database files from loading onto the live production host
          exclude: |
            **/.git*
            **/.git*/**
            **/Dockerfile
            **/docker-compose.yml
            **/*.sql